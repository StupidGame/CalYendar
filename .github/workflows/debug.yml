name: Build Debug APK

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debug-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show build source
        env:
          BUILD_BRANCH: ${{ github.head_ref || github.ref_name }}
          BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          printf 'Branch: `%s`\n\nCommit: `%s`\n' "$BUILD_BRANCH" "$BUILD_COMMIT" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run unit tests and build debug APK
        run: bash ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: debug-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: calyendar-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
